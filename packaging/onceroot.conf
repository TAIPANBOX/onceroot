# /etc/onceroot/onceroot.conf
# Users whose agents may ask for root. Set your own uid (id -u) and add
# yourself to the onceroot group: sudo usermod -aG onceroot $USER
allowed_uids = 1000

# ttl = 10m            how long a request waits for a person
# max_open = 3         open requests per user
# max_per_hour = 30    requests per user per hour
# pause_after = 3      rejections in a row before a pause
# pause = 15m
# command_limit = 30m  time limit of one command

# How the desk asks: auto (the polkit dialog opens at once on Omarchy, whose
# dialog shows the whole card; elsewhere approve from `onceroot review`),
# dialog (always open the dialog), review (never open it on its own).
# desk_prompt = auto

# Approval from the phone (off by default). See "Approval from your phone" in README.md.
# phone = telegram
# telegram_chat = 123456789
