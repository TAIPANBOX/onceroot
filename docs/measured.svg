<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Measured on 2026-10-27: 220 test runs, 206 scenarios, 55 of 55 mutants caught, 9 of 9 gates, 89.2 percent coverage as root, and the whole flow on Omarchy 4.0.6 in a VM">
<defs>
