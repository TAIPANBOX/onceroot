<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="An agent asks oncerootd for one command; oncerootd checks it and shows you a card; you approve in your desktop's dialog; the command runs once and every step is journalled">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e6edf3"/>
    <stop offset="1" stop-color="#2dd4bf"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/>
<rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<line x1="380" y1="330" x2="450" y2="330" stroke="#283341" stroke-width="2"/>
<path d="M 450 330 l -11 -6 l 0 12 z" fill="#4493f8"/>
<circle cx="380" cy="330" r="4" fill="#4493f8">
  <animate attributeName="cx" values="380;450" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4s" repeatCount="indefinite"/>
</circle>
<line x1="830" y1="330" x2="900" y2="330" stroke="#283341" stroke-width="2"/>
<path d="M 900 330 l -11 -6 l 0 12 z" fill="#d29922"/>
<circle cx="830" cy="330" r="4" fill="#d29922">
  <animate attributeName="cx" values="830;900" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4s" repeatCount="indefinite"/>
</circle>
<rect x="450" y="130" width="380" height="370" rx="14" ry="14" fill="none" stroke="#2dd4bf" stroke-width="4" filter="url(#glow)">
  <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
</rect>
<rect x="450" y="130" width="380" height="370" rx="14" ry="14" fill="#141a23" stroke="#2dd4bf" stroke-width="1.6" filter="url(#soft)"/>
<text x="640" y="166" font-size="22" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">oncerootd, as root</text>
<line x1="472" y1="180" x2="808" y2="180" stroke="#222b38" stroke-width="1"/>
<rect x="472" y="194" width="336" height="142" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1"/>
<rect x="472" y="194" width="6" height="142" rx="3" ry="3" fill="#2dd4bf"/>
<text x="498" y="230" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">checks</text>
<rect x="724" y="212" width="70" height="22" rx="11.0" ry="11.0" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="759.0" y="227.5" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">kernel</text>
<line x1="498" y1="246" x2="782" y2="246" stroke="#222b38" stroke-width="1"/>
<text x="498" y="276" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">who: uid, pid, process chain</text>
<text x="498" y="298" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">what: root-owned file, SHA-256</text>
<text x="498" y="320" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">rules: allow, deny, built-in</text>
<rect x="472" y="348" width="336" height="132" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1"/>
<rect x="472" y="348" width="6" height="132" rx="3" ry="3" fill="#2dd4bf"/>
<text x="498" y="384" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">one card</text>
<rect x="716" y="366" width="78" height="22" rx="11.0" ry="11.0" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="755.0" y="381.5" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">for you</text>
<line x1="498" y1="400" x2="782" y2="400" stroke="#222b38" stroke-width="1"/>
<text x="498" y="430" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">every argument quoted</text>
<text x="498" y="452" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">fits the dialog, or refused</text>
<rect x="60" y="230" width="320" height="200" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="60" y="230" width="6" height="200" rx="3" ry="3" fill="#4493f8"/>
<text x="86" y="266" font-size="20" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">The agent</text>
<rect x="308" y="248" width="58" height="22" rx="11.0" ry="11.0" fill="#141a23" stroke="#4493f8" stroke-width="1"/>
<text x="337.0" y="263.5" font-size="12.5" fill="#4493f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">asks</text>
<line x1="86" y1="282" x2="354" y2="282" stroke="#222b38" stroke-width="1"/>
<text x="86" y="312" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">onceroot run --why ... --</text>
<text x="86" y="334" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">  pacman -S hyperfine</text>
<text x="86" y="356" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">or the MCP tool run_as_root</text>
<rect x="900" y="230" width="320" height="200" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="900" y="230" width="6" height="200" rx="3" ry="3" fill="#d29922"/>
<text x="926" y="266" font-size="20" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">You</text>
<rect x="1122" y="248" width="84" height="22" rx="11.0" ry="11.0" fill="#141a23" stroke="#d29922" stroke-width="1"/>
<text x="1164.0" y="263.5" font-size="12.5" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">approve</text>
<line x1="926" y1="282" x2="1194" y2="282" stroke="#222b38" stroke-width="1"/>
<text x="926" y="312" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">Omarchy's polkit dialog:</text>
<text x="926" y="334" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">fingerprint, key, password</text>
<text x="926" y="356" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">or onceroot review</text>
<path d="M 1060 430 L 1060 590 L 830 590" fill="none" stroke="#283341" stroke-width="2"/>
<path d="M 830 590 l 11 -6 l 0 12 z" fill="#3fb950"/>
<circle r="4" fill="#3fb950"><animateMotion path="M 1060 430 L 1060 590 L 834 590" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="1074" y="520" font-size="13" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">yes, once</text>
<rect x="450" y="548" width="380" height="84" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="450" y="548" width="6" height="84" rx="3" ry="3" fill="#3fb950"/>
<text x="476" y="580" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">runs once, within a time limit</text>
<text x="476" y="608" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">fixed environment, no input</text>
<line x1="60" y1="660" x2="1220" y2="660" stroke="#222b38" stroke-width="1"/>
<text x="640" y="688" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Every request, decision and run goes into a signed, hash-chained journal.</text>
<text x="1252" y="712" font-size="12" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">github.com/TAIPANBOX/onceroot</text>
</svg>
