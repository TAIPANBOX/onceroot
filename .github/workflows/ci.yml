name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: format, vet, test as user and root, gates, mutants and vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify modules
        run: go mod verify

      - name: Build with the package flags and measure the binaries
        run: |
          export CGO_ENABLED=0 GOFLAGS='-buildmode=pie -trimpath -mod=readonly'
          go build -ldflags '-bindnow' -o "$RUNNER_TEMP/onceroot" ./cmd/onceroot
          go build -ldflags '-bindnow' -o "$RUNNER_TEMP/oncerootd" ./cmd/oncerootd
          ONCEROOT_CHECK_BIN="$RUNNER_TEMP/onceroot:$RUNNER_TEMP/oncerootd" \
            go test -count=1 -run '^TestBuiltBinariesAreHardened$' -v ./internal/gates/

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Test as root, with the end-to-end daemon test
        # root keeps its own build cache, so later steps can still write theirs
        run: |
          sudo groupadd --system onceroot
          sudo useradd --create-home tester
          sudo env "PATH=$PATH" HOME=/root \
            ONCEROOT_E2E_USER=tester go test -count=1 -v -run 'TestDaemonEndToEnd|TestServeRefusesABadSetup' ./cmd/oncerootd/ | tee "$RUNNER_TEMP/e2e.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/e2e.log"; then
            echo "the root tests skipped, so they measured nothing"
            exit 1
          fi
          sudo env "PATH=$PATH" HOME=/root \
            ONCEROOT_E2E_USER=tester go test -count=1 ./...

      - name: Gates have teeth
        run: sh scripts/gates-have-teeth.sh

      - name: Mutation testing of the decision path
        run: python3 -I scripts/mutate.py

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  package:
    name: the package builds and passes its checks in Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed git go namcap polkit  # polkit: a runtime dependency makepkg checks

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the package as a normal user, the way README says
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' && cd '$GITHUB_WORKSPACE' && scripts/package.sh"

      - name: Lint the package
        run: namcap onceroot-*.pkg.tar.zst

      - name: Once its version is tagged, the PKGBUILD fetches exactly the released source
        run: |
          ver=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$ver" >/dev/null; then
            su builder -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --verifysource"
          else
            echo "v$ver is not tagged yet, so there is no released source to check"
          fi
